<script id="speaker-notes" type="application/json">["大家有没有这样的体验：昨天已经跟 AI 讲清楚了一个模块，今天换个会话，又要从目录结构、业务规则开始解释；代码写到一半中断，再回来还得先问一句，我们做到哪儿了？\n\n我做 Flow2Spec，想解决的就是这些重复交代的成本。让项目背景、任务现场和已经确认的规则有地方保存，而且下一次真正找得到、用得上。今天不只介绍架构，也分享我在生产仓里的接入情况，以及日常开发究竟怎么用。","今天按八个部分讲。先看为什么需要和实际接入情况，再解释体系原理，第三部分讲如何接入和初始化，第四部分进入五类日常使用场景。第五部分单独分享使用效果与效率提升，把我的真实体验、个人时间案例和具体需求的效率对照讲清楚。第六部分看团队协作，第七部分补充配置、冷知识与常用命令，最后讲后期迭代计划。\n\n大家不用记住所有技能名称。听完能判断当前这件事从哪里开始、AI 依据什么执行、做完以后留下什么，就可以开始实践。","先从问题开始。AI 不知道项目背景时，我们会不断补上下文；但补得越多，就越容易碰到另一个问题：旧规则、新需求、搜索结果混在一起，到底应该信哪一份？\n\n所以我们要解决的，不只是“让 AI 多记住一点”，还有让它在这次任务里读到正确的那一部分。","看左边这些来源：规则、文档、代码搜索，每一种都有价值。问题是，把它们全部堆进会话，并不能保证 AI 识别出当前有效的事实。比如一份旧方案写着允许重试，代码后来已经加了限制；如果不检查来源和当前状态，信息越多，反而越容易选错依据。\n\n右边是我们真正需要的能力：先路由到相关知识，再补齐必要前提，执行前检查是否足够，变更后把新事实写回来。这是一套持续维护上下文的办法。\n\n这并不意味着以后不读源码，而是不要每次都从全仓搜索开始。下面先用我自己的接入情况，看看它覆盖了什么规模。","Flow2Spec 已经应用于不同体量的项目，不只是表格里的四个生产仓库，也接入了多个活动页项目。活动页项目暂未纳入这次统计，所以不能把表格理解成全部接入范围。\n\n表中数据来自 flow2spec-intro-public 的 2026 年 9 月统计，仅这四个仓库合计就有 1326 个文件、约 16.5 万行代码，形成了 103 个 topic、98 个 matcher、193 份沉淀文档，以及 80 个归档任务。这里既有主仓，也有接口仓、管理后台和客户端，体现的是不同规模、不同类型项目中的实际使用。\n\n主仓的协作也是真实发生的：三个月里有 27 位作者、2786 次 commit。后面讲团队协作时还会回到这个数字。\n\n这页最值得带走的不是总行数，而是读取方式：在这些实践里，一次任务通常先加载约几百行命中的 topic，而不是扫描整个仓库。遇到知识缺口仍要定向补读，这不是一个固定耗时或准确率承诺。","下面解释为什么它能这样工作。先看知识、任务、规则、技能四部分的分工，再看知识如何分层，以及一次任务如何从命中走到行动。\n\n这一章的关键，是把“保存信息”和“正确使用信息”分开看。只有文档，没有读取和更新机制，记忆还是会慢慢失效。","我用 Memory Coding 来概括这件事：把项目记忆编码进仓库。这里的记忆，不是模型偷偷记住了什么，而是能看到、能检查、能随项目演进的文件和约定。\n\n四个环各管一件事。.Knowledge/ 保存项目事实；.task/ 保存当前任务现场；规则约束读取顺序和执行边界；f2s-* 技能把常见动作串成流程。\n\n举个例子，新增一个能力时，技能带着 Agent 推进，规则提醒它先读哪些依据，任务记录做到哪一步，知识库接收最终确认的变化。换会话之后，不需要靠上一段聊天维持这一切。接下来先展开知识环。","这四层可以理解成“先找入口，再看事实，最后查原始材料”。L0 的 manifest-routing.json 是总入口；L1 的 matcher 判断这次描述属于哪个主题；L2 的 topic 保存完成任务所需的事实、约束和下一步指针；L3 才是更完整的文档材料。\n\n比如要修改重试逻辑，不必先打开所有设计文档。先命中重试主题，读清楚适用条件和限制；如果主题没有说明某个异常分支，再按指针补读方案或源码。\n\n还有一个容易混淆的区别：stock-docs 主要沉淀已经落地的能力，req-docs 保存需求与技术方案。两者都可以提供背景，但不能把一份能力沉淀文档直接当成当前需求的实现方案。","目录结构落到执行时，就是这四步。match，先找主命中；expand，把必要依赖展开；verify，判断手上的事实是否足够支持行动；最后才是 act。\n\n这里我最想强调 verify。命中了一个主题，并不等于已经知道所有答案。如果接口行为、配置条件或边界缺失，就要说明缺什么，再定向补证据。低置信的兜底主题，也不能直接拿来决定怎么改代码。\n\n因此，按需读取不是越少越好，而是在足够的前提下少读无关内容。这也解释了为什么命中后还要展开依赖。","业务主题回答了“这段逻辑是什么”，却不一定回答“在这个项目里应该怎样修改它”。例如任务规划还依赖任务记录规则，写技术方案还依赖文档路径约定，改配置还要知道默认值和生效边界。\n\ntopicDependencies 就是把这些必要前提显式写出来。Agent 命中主主题后，可以沿依赖补齐执行依据，而不是靠临时想起来。\n\n但依赖也要克制。不是两个主题沾边，就把它们连起来；应该判断，缺了这个前提，是否会影响正确执行。否则依赖无限展开，又会回到上下文越堆越多的问题。这一页侧重 Flow2Spec 内置主题之间的执行约束，解决的是内部流程闭环。下一页把同一种依赖机制放到业务页面，看看项目自身的知识怎样补齐。","前一页讲的是内置规则之间的依赖，这一页看业务知识。以现有材料里的“商品评价”业务为例，用户虽然只提到了页面或功能，Agent 不能只读评价主题就直接动手。\n\n从上往下看，本域主题包含 Redis 锁、AI 评分和本域例外；还要结合 C 端白名单主题，确认 UID 隔离和错误码；平台上下文解释业务子域、三个仓库的分工和别名；公共模块主题则提供 ctx、responseData、QMQ、getDb 和数据库字段约定。只读本域，就可能漏掉权限或公共约束。\n\n这些关系要在知识主题依赖里明确维护，命中后沿已声明的依赖展开，再检查依据是否足够。图里画的是知识读取需要补齐的前提，不是说浏览器运行时依次调用这四层，也不是系统凭空推断出了所有页面依赖。\n\n所以两页是互补的：内置主题保证流程按约定推进，业务主题让执行符合项目自己的规则。理解了这个区别，再看第一次接入如何建立项目架构和可路由知识。","接入不要求先花一周补齐整个项目的文档。先安装 CLI，初始化骨架，然后生成项目架构，让 AI 有一张基本地图；接下来从当前需求或者一个具体模块开始，把知识逐步补起来。\n\n这里最容易漏掉的一步，是 init 之后生成项目架构。只有目录和规则，还不等于 AI 已经了解了业务。","如果还没有安装，可以先运行 npm install -g @double-coding/flow2spec。之后在项目里执行 flow2spec init，建立配置、入口和知识库骨架。\n\n紧接着使用 f2s-doc-arch，梳理模块、入口和边界，形成架构初稿；再用 f2s-doc-final 整理终稿，通过 f2s-kb-build 形成 topic、matcher 和路由。注意，初稿到终稿这一步不能省成“扫完代码就已经建好知识库”。\n\n首次架构建立以后，不需要为了追求完整而停下开发。新增能力用 feat，问题修正用 fix，已有实现用 sync，问答中发现的新事实可以通过 distill 沉淀。知识库就是这样跟着实际工作增长的。","现在把前面的部分放回一条开发流程。用户描述需求之后，Agent 先澄清边界，再形成技术方案，随后实现、记录进度、同步知识、检查提交。\n\n请看技术方案旁边这句“根据命中的知识和用户描述”。方案不是只读一份主题摘要就生成了，也不是只照着用户的一句话发挥。项目知识提供已有约束，用户描述提供本次目标，两者结合，才能判断哪些能力可以复用、哪些地方真正需要改动；有矛盾或缺口就继续澄清。\n\n每一步还会留下不同的产物：需求和方案保留决策依据，任务文件保留执行现场，知识主题保留以后值得复用的事实。所以一次交付结束，除了代码，还多了一份下次能用上的项目记忆。下面用两张地图把技能入口分清楚。","这一页是日常最常用的十个技能，我按需求、实现、知识和提交四类来记，而不是按名字背。\n\n需求不清楚时，用 req-clarify 和 req-tech；准备推进实现时，用 req-plan 规划并维护任务，小能力和问题修正分别用 kb-feat、kb-fix。它们是不同场景的入口，不意味着每次都要把这一列顺序执行一遍。\n\n知识这一列也有区别：kb-add 补已有模块，kb-addRules 记录口述规则，kb-sync 对齐实现事实，kb-distill 沉淀问答中值得复用的知识。提交用 git-commit。图上统一省略了 f2s- 前缀，实际是在 AI 对话里使用。\n\ndoctor 和 kb check 不在这张技能图里，它们是 CLI 诊断、校验命令，后面单独讲。先看其余八个按需技能。","加上这一页，当前十八个 Flow2Spec 技能就列全了。“非核心”只是说日常调用频率相对低，不代表不重要；首次接入时，建库这一组反而非常关键。\n\n左边是建库与规范化：doc-arch 形成架构初稿，doc-final 整理终稿，kb-build 建立可路由知识。中间是维护与协作：kb-merge 处理合并产生的上下文冲突，kb-rm 移除废弃知识主题和路由，kb-upgrade 做知识库模板对齐。右边是资料与回顾：doc-pdf 转换 PDF，doc-milestone 生成项目里程碑。\n\n例如一个旧能力下线了，知识库不能继续把它当作有效事实。这时就需要 kb-rm，而不是只在聊天里告诉 AI“以后别用了”。有新增、有同步，也有删除和维护，知识才能跟上项目变化。","入口知道了，接下来回到每天真正会遇到的事情：一个大需求、一个缺陷、一项新能力、一个没有知识的老模块，或者一次普通问答。\n\n我们先看总路径，再展开典型例子。最后把验收和用户待办单独拿出来，因为“代码已经写完”往往还不是任务真正结束。","这张图可以当作选择入口的速查。大需求还存在不确定性，就从澄清、方案开始；明确的错误走 Fix；新增能力走 Feat；老模块缺知识，先补知识再开发；普通问答则先回答，再判断是否值得沉淀。\n\n不是每件事都需要完整走最长流程。一个复现清楚的小缺陷，不必重新组织一轮大需求讨论；反过来，一个边界没说清楚的新功能，也不能因为想快就直接开写。\n\n后面把 Fix 和 Feat 合在一页对比，再分别讲老模块和问答；验收页则补充说明大需求的最后一段。我们先从流程最长的大需求看起。","用一个具体例子：新增批量重算，要求失败可以重试，同时不能重复执行。看起来一句话就能说完，但重试整个批次还是失败条目？什么时候算重复？这些决定不能留到代码里临时猜。\n\n先用 req-clarify 问清边界，留下澄清文档；req-tech 结合命中知识形成技术方案；req-plan 再拆任务、推进实现。实现完成后，用 acceptance.md 验证重试和幂等是否符合要求，user-todos.md 则记录需要用户处理的配置、数据或发布事项。\n\n验收和外部待办都按约定收口，再同步知识、提交。以后再改重算能力，AI 就能先读到这次确认的边界，而不是重新推断一遍。这个例子里的文档、任务状态和代码，是互相对应的三件事。","还是重算这个例子。如果已经有防重复执行规则，但某个异常分支绕过了检查，这是 Fix：描述问题，修复实现，同步修正后的知识，再提交。kb-fix 默认把代码与知识同步一起考虑。\n\n如果此前没有失败重试，现在要新增，这是 Feat：描述能力，创建任务，实现功能，同步知识，提交。kb-feat 面向新增能力；如果能力已经实现，也可以只补齐知识同步。\n\n两者共同点是不能只改代码、留下旧知识。区别在于入口和典型任务长度。默认配置里 feat 开启变更追踪，fix 关闭；项目可以调整开关，所以不能把短路径理解成“所有 Fix 都不记录任务”。","接手一个旧模块时，先检查路由，发现知识缺口后，可以把明确路径交给 f2s-kb-add，例如 src/旧模块。它从已有代码和文档里整理事实，经过初稿、终稿，再形成 topic 和 matcher。\n\n这一步重点不是让 AI 把目录重新描述一遍，而是把后续修改需要的边界留下来：模块负责什么，关键条件是什么，哪些地方不能随便改，进一步核验该看哪里。\n\n第一次梳理需要读代码，但这次投入会留下结果。下一次命中同一模块，就先读可路由知识，只有遇到缺口或事实变化再定向下钻，不必又从全仓 grep 开始。","还有一种情况，并没有要求 AI 改代码，只问“为什么这个状态不能重试”。AI 先基于已有知识回答；如果为了回答发现了知识库没有记录的新事实，就可以提示是否通过 f2s-kb-distill 沉淀。\n\n这里要区分“提示沉淀”和“已经写入”。用户确认后，再新建主题或补充已有主题；如果原有知识已经覆盖，就没有必要重复保存一份。不是每次普通聊天都会自动改仓库。\n\n它带来的变化很实际：同一个问题，下次可以直接命中已经确认的规则，不再重复搜索和解释。零散问答也因此成为项目知识的一个入口。","这一页是大需求流程的补充。task.md 记录实现步骤，步骤打勾说明动作做了；acceptance.md 检查结果是否达到要求，两者不是同一件事。比如重试代码已写，但重复执行是否被阻止，还要有验收依据。\n\nuser-todos.md 管另一类事情：数据库变更、环境配置、人工确认或者发布操作。AI 不能把自己无权完成的事顺手标成已完成。context.md 保存恢复现场需要的背景，todo.json 是找到当前任务的索引。\n\n所以一句“继续”能够恢复，不是靠模型记住上次聊天，而是任务目录里确实留下了做到哪里、还差什么。等实现、验收和外部待办按门禁完成，任务才能真正归档。\n\n五类场景讲完，再回到我实际使用时最直接的感受，以及一个个人效率案例。","前面讲的是这套流程怎么用。接下来单独看使用效果：它究竟改变了我哪些工作习惯，又在哪些地方节省了精力。\n\n我会先讲与 AI 协作时最直接的感受，再给出一个个人时间案例，最后看乐赚贴和盲盒次卡两个需求的耗时对照。这里会把个人体验、实际记录和没有统计的数据区分开，不把一个案例说成适用于所有项目的提升比例。","我最明显的感受，不是 AI 打字更快了，而是我终于不用每次从头带它认识这个项目。打个比方，没有项目记忆时，每次打开 Agent 都像新招了一个员工：业务概念要解释，历史原因要补充，问到哪里就临时查到哪里。有了持续维护的知识，交流更像给熟悉业务的老员工交代工作。\n\n在我已经了解项目的情况下，我先把产品需求提炼清楚，交代目标和边界。AI 能结合历史规则理解我说的业务概念，反问也更容易问到关键处。该澄清的澄清完，它就按已有的规则推进，我不需要事无巨细地告诉它每一步怎么写。这也是我说，做需求的那几天反而更轻松的原因。\n\n这里的轻松不是放弃责任。我仍然负责目标、关键决策、代码审查和验收；减少的是持续盯着实现、反复补背景、发现偏了再打一层补丁。下一页用我自己的一个时间案例说明。","举一个我个人的例子：一个排期五天的需求，我一般可以用两天开发，再用一天测试，三天完成开发与测试。这还不是我追求极限速度的情况。真正变化的是，我花在反复解释背景、纠正实现方向和重建上下文上的精力少了。\n\n我的工作更像先给员工交代清楚任务：把产品需求提炼出来，让 AI 基于已有项目知识询问需要明确的地方，关键问题确认后再推进。于是我不用一直盯着屏幕告诉它下一步写哪段代码，能把注意力放回需求判断与最终验收。\n\n这张图比较的是原排期和我报告的实际用时，不是“同一需求不用工具做一次、用工具再做一次”的对照实验，也不是部门排名。我没有把它包装成普适的提升比例。熟悉项目、知识质量、任务难度和测试范围都会影响结果。下面用述职中记录的乐赚贴和盲盒次卡两个需求，具体看耗时对照和效率提升。","这次直接回答两个问题：做的是哪个需求，效率到底提升了多少。\n\n左边是乐赚贴在六月二十五日快照里的这一批交付：四张新表、二十五个新接口，管理端净增五千四百九十四行。我的述职材料给出的耗时对照是，纯手工约一个月，普通 AI 辅助约两周，使用 Flow2Spec 是三天；原稿将对比纯手工的效能记为约十倍。这里沿用原述职的月份与天数口径，不把它另外换算成精确工作日收益，也不混入后续累计的接口和代码量。\n\n右边是盲盒次卡后端需求，七月二日归档，涉及三张新表、四处主卡联动和七个新 handler。纯手工的对照为八到十二个工作日，普通 AI 辅助为四到六个工作日；我使用 Flow2Spec，后端开发一天，接口调试一天，合计两个工作日。按这组数据，对比纯手工是四到六倍，对比普通 AI 辅助是两到三倍。这里包含后端调试，不包含前端工作。\n\n这些是我个人述职记录里的具体案例，不是所有需求都能达到的统一倍数，也不是严格控制变量的实验。项目知识积累、需求复杂度和使用熟练度都会影响效果。我想传达的是，已有知识被持续复用以后，收益不仅是少写代码，更是少解释背景、少走偏路，让完整需求更快交付。接下来再看，这份积累怎样在团队里共享。","个人用起来以后，团队一定会问：大家都在记录任务、修改知识，会不会互相覆盖？这里要区分两种东西，个人执行现场和团队共享事实。\n\n先看它们如何隔离和合入，再用一个具体冲突案例说明，合并知识时怎么借助 kb-merge，又有哪些判断仍然需要人来做。","回到主仓 A 的数据：三个月、27 位作者、2786 次 commit、43 个归档任务。在这样的协作规模下，所有人共用一份任务进度显然不合适。\n\n个人现场放在 .task/\u003cdeveloperId>/，默认不进 Git；确认后的项目知识放在 .Knowledge/，随代码通过 Git 和 PR 共享。developerId 可以显式配置，也可以从 Git 身份解析。团队观察进展主要看 PR、提交和知识变更，而不是把个人任务目录当成团队看板。\n\n共享知识也不能悄悄覆盖。kb-delta.json 记录变更意图，topic revision 用来检查这次修改基于哪个版本。版本已经变化，就先停下来重读最新事实、调整变更。这个 revision 冲突，与下一页的 Git 文本冲突，是两种不同情况。\n\n这些协作机制还有一个更长期的意义：让项目知识能够跨人员交接。","团队层面，我希望项目知识不要只留在某几个核心同学脑子里。历史决策、业务概念、能力边界和踩过的坑，如果持续沉淀在仓库里，即使人员变化，已经记录下来的这部分经验仍然可以被团队使用。\n\n新人不必先找到每一个老同学分别问一遍，再把碎片拼起来。他可以通过结合项目知识的 Agent，先建立项目的能力地图，理解哪些东西可以复用、哪些边界不能随意突破，再带着具体问题与同事确认。Agent 的优势是能统一检索跨模块的已沉淀信息，而不是凭资历记忆。\n\n这里我把边界说清楚：知识必须持续更新和审核；没有记录的经验、还没落盘的决策以及协作关系，依然需要人工交接。因此目标是降低关键人员依赖、减少知识随人流失，不是承诺任何人离开都绝无影响。共享的知识也会被多人修改，接下来再看遇到合并冲突怎么办。","举个协作示例：同事 A 给一个模块补了失败重试规则，同事 B 同时补了幂等约束。两边分别提交后，Git 合并同一份上下文文档出现冲突。这时可以在 AI 对话里调用 f2s-kb-merge，一键发起处理，不必逐份对照索引、规则和说明文档。\n\n对于可以合并的上下文，它会保留双方独有信息，去重、对齐引用，并检查冲突标记是否清除。可以指定文件，也可以让它扫描当前仍有冲突的文件。处理后，我们复核结果，再提交。\n\n“一键”指的是处理入口，不是取消判断。如果双方事实互斥、无法确定哪边正确，仍要确认；业务代码、依赖、构建和部署冲突也不会擅自合并。还有，前一页的 revision 不匹配要先重读知识，不是调用 kb-merge 就能绕过去。","先补几个实际使用时很有帮助的点。前面看到的流程，并不是所有行为都写死了；项目可以通过配置调整一部分工作方式。\n\n我们看一下配置入口，再澄清几个容易记混的概念，最后把 CLI 命令和聊天技能彻底分开。","入口就是项目根目录的 flow2spec.config.json。左边这组影响 Agent 的工作方式：是否允许拆子 Agent，是否按技能约定做交叉校验，以及是否对高置信操作意图自动分流。\n\n右边的 changeTracking 分别控制 feat、fix、implement 的变更追踪；当前默认是 feat 和 implement 开启、fix 关闭。collaboration 控制任务目录隔离与身份，locale 控制模板语言，updateCheck.enabled 控制版本更新提示。\n\n举个例子，希望小修复也留下任务现场，就可以开启 fix 的追踪；希望手动选择技能入口，可以关闭意图自动分流。具体仍要以项目磁盘上的配置和技能约定为准，不能只记一套默认值。也不要反过来理解成所有规则都能通过开关绕过。","第一，init 对齐的是骨架，不代表新业务知识已经自动生成。跑完 init，还要有架构梳理和后续知识维护。\n\n第二，req-plan 本身就是任务规划入口，始终维护任务；不要以为关了 feat 或 fix 的追踪，就能同时关闭 req-plan 的任务记录。\n\n第三，kb-rm 删除的是指定文档对应的知识主题和路由，不是帮你删除业务代码，源文档也会保留。能力下线时，代码处理和知识清理要分别确认。\n\n第四，名字相近的两个 build 不是一回事。聊天里的 f2s-kb-build 从终稿提炼知识；终端里的 flow2spec kb build 按现有 topic 元数据归一化路由。前者处理语义，后者做确定性的结构维护。\n\n还有一个长期维护中的问题值得单独讲：业务持续增长以后，一个 topic 会不会变得太大？下一页看现在可以怎样处理。","再补一个随着使用时间增长才容易遇到的问题：业务一直迭代，每次都往同一个 topic 里加一点，最后主题可能越来越长，职责也越来越杂。内部虽然已有长度、分类、职责边界等约束和拆分准则，但不能因此认为知识永远不会膨胀。\n\n遇到这种情况，现在可以直接让 AI 按业务职责拆分。主 topic 保留业务闭环和入口，适合独立命中的职责再形成子 topic；完整实现细节可以放回对应的长文文档。拆分不能只把一份 Markdown 切成几段，还要检查 matcher、索引和已有依赖，确保原来的问题仍能找到正确事实。\n\n也要避免为了缩短篇幅而制造无意义的小主题。主子主题之间的导航，不要一律写成强依赖。后续可能会把这类整理过程做成专用 skill，但目前还没有推出，不需要等它上线，现在就可以手动发起并核验。","这一页是终端命令，全部加 flow2spec 前缀；前面 f2s-* 则是在 AI 对话中触发的技能。左边三项负责接入和版本：init 建骨架，version 看本地版本，update --check 看可用更新，检查本身不等于执行升级。\n\n中间是诊断和校验。doctor 只读检查环境、项目入口和知识健康，不会自动修复；kb status 看知识库与当前 delta 状态；kb check --strict 做严格校验。因此 doctor 和 kb check 应归到工具层，不能跟 git-commit 混成三个收尾技能。\n\n右边是安全合库：plan 先预演，发现冲突就停；通过后 apply 才真正应用变更；build 维护路由元数据。apply 和 build 会写盘。日常可以由技能衔接这些动作，这张表主要方便独立排查、维护和接入自动检查时查阅。\n\n到这里是现有能力和使用方式。下面进入后期迭代计划，看看还准备补齐什么。","前面是现在的架构和使用方法，接下来是后期迭代计划，不是已经完成的功能。\n\n我主要准备继续推进两个方向：一是让一次需求从澄清到任务、文档和知识都能串起来，再支持团队查看；二是完善前后端自动化测试，让实现后的验证更扎实、更容易重复。","第一个方向，是给每次需求生成一个贯穿前后的索引 ID。需求澄清、技术方案、topic、终稿、初稿和 task，都用这个 ID 建立关联，再用独立的 JSON 记录这些关系。图中的六类产物是关联对象，并不是说它们必须按图上的摆放顺序依次生成。\n\n这样，将来回看一次需求，就不必在几个目录里根据文件名猜：这份方案对应哪个任务，这个主题来自哪次变更，这份终稿又关联哪些过程材料。先把索引建立起来，让产物之间可以追溯。\n\n在这个基础上，后续再做 Web 页面，看到团队各成员在推进什么、各节点有哪些产物、当前处于什么状态，并沿着同一个需求查看完整过程。这里要和当前机制区分开：现在个人任务仍按 developerId 隔离，团队 Web 与跨节点索引是规划中的新增能力，具体共享与汇总方式还要设计。","第二个方向是完善自动化前后端测试。前面讲了验收清单，但“知道要验什么”和“能够稳定、重复地完成验证”，之间还有需要补齐的环节。\n\n前端关注页面行为和关键交互，后端关注接口行为与业务逻辑，再补齐前后端联调和关键链路回归。后续希望测试执行与结果反馈衔接得更好，让问题在交付前更早暴露，也让重复验证不必每次都从头组织。\n\n这一页表达的是迭代方向，不预设具体测试框架或上线时间，也不意味着人工验收和外部确认可以全部省掉。最终目标还是让每次交付有更可靠的验证依据。","回到开头的问题：我们不是缺更多聊天记录，而是缺能被下一次工作可靠复用的项目事实。今天从真实接入情况讲到四环架构、初始化、日常使用，再到团队合并、知识维护和后期规划，都是围绕这件事。\n\n开始不复杂：安装 CLI，运行 flow2spec init，生成项目架构，然后从当前需求或者一个老模块开始。不需要等所有文档齐全，也不用第一天就记住十八个技能。\n\n我更希望大家先做成一个小闭环：完成一次工作，把经过确认的知识留下来，再看看下一次相同模块的任务，能不能直接用上。让每次开发不只交付代码，也让项目更容易被理解和接手。\n\n全链路索引、团队 Web 和更完整的自动化测试，是继续演进的方向；今天开始使用已有流程，并不需要等这些计划全部完成。"]</script>
