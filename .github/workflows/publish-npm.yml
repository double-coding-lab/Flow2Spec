name: Publish package to npm

on:
  release:
    types:
      - published

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish tagged Flow2Spec package
    runs-on: ubuntu-latest
    steps:
      - name: Check out release commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.release.tag_name }}

      - name: Verify release commit belongs to main
        shell: bash
        run: |
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Update npm for trusted publishing
        run: npm install --global npm@latest

      - name: Install workspace dependencies
        run: npm ci --ignore-scripts

      - name: Verify workspace and release tag versions
        run: npm run version:check -- --tag "$GITHUB_REF_NAME"

      - name: Run tests
        run: npm test

      - name: Verify npm package contents
        run: npm run pack:check

      - name: Publish Core package with provenance
        if: startsWith(github.event.release.tag_name, 'core-v')
        run: npm publish --workspace @double-coding/flow2spec-core --access public --provenance

      - name: Publish CLI package with provenance
        if: startsWith(github.event.release.tag_name, 'cli-v')
        run: npm publish --workspace @double-coding/flow2spec --access public --provenance
