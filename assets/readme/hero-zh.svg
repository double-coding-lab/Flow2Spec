<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Flow2Spec 在修改代码前加载正确项目事实</title>
  <desc id="desc">静态产品首屏图，展示 Flow2Spec 把自然语言需求路由到 AI 修改代码前需要读取的少量项目事实。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05070B"/>
      <stop offset="0.52" stop-color="#08111D"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111C2D"/>
      <stop offset="1" stop-color="#07111C"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="0.62" stop-color="#67E8F9"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
    <radialGradient id="halo" cx="42%" cy="38%" r="62%">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#233247" opacity="0.55"/>
    </pattern>
    <clipPath id="clip">
      <rect width="1200" height="420" rx="34"/>
    </clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="1200" height="420" fill="url(#bg)"/>
    <rect x="30" y="30" width="1140" height="360" rx="30" fill="url(#dots)" opacity="0.58"/>
    <circle cx="250" cy="126" r="230" fill="url(#halo)"/>
    <path d="M78 300C244 238 378 258 522 210C676 158 764 82 1088 96" fill="none" stroke="#38BDF8" stroke-width="2" opacity="0.14"/>
    <path d="M616 296C746 248 860 260 1088 210" fill="none" stroke="#F59E0B" stroke-width="2" opacity="0.12"/>
  </g>

  <g id="title-block" transform="translate(76 70)">
    <text x="0" y="0" fill="#67E8F9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" letter-spacing="2.8">AI CODING CONTEXT ENGINE</text>
    <text x="0" y="76" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="76" font-weight="860">Flow2Spec</text>
    <text x="2" y="123" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="29" font-weight="720">让 AI 动手前先读到正确事实。</text>
    <text x="2" y="162" fill="#9FB3C8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="21">把自然语言需求转换成 AI 应该先读的事实，</text>
    <text x="2" y="192" fill="#9FB3C8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="21">再进入代码修改。</text>

    <g id="install-chip" transform="translate(0 236)">
      <rect width="408" height="52" rx="18" fill="#08111D" stroke="#26364C"/>
      <circle cx="26" cy="26" r="6" fill="#22D3EE"/>
      <text x="46" y="32" fill="#D8E2EE" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">npx @double-coding/flow2spec init</text>
    </g>
  </g>

  <g id="context-receipt" transform="translate(658 58)">
    <rect width="470" height="288" rx="28" fill="url(#card)" stroke="#2A3B55"/>
    <rect x="18" y="18" width="434" height="252" rx="20" fill="#060D18" stroke="#1F2F46"/>
    <circle cx="44" cy="42" r="6" fill="#F87171"/>
    <circle cx="66" cy="42" r="6" fill="#FBBF24"/>
    <circle cx="88" cy="42" r="6" fill="#34D399"/>
    <text x="116" y="49" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="22" font-weight="760">改代码前，先加载事实</text>

    <g id="receipt-lines" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17">
      <text x="42" y="92" fill="#64748B">用户需求</text>
      <text x="174" y="92" fill="#F8FAFC">"修复批量重评分"</text>
      <text x="42" y="128" fill="#64748B">Flow2Spec</text>
      <text x="174" y="128" fill="#67E8F9">命中对应 matcher</text>
      <text x="42" y="164" fill="#64748B">AI 读取</text>
      <text x="174" y="164" fill="#F8FAFC">4 topics · ~300 lines</text>
      <text x="42" y="200" fill="#64748B">硬事实</text>
      <text x="174" y="200" fill="#FDBA74">Redis lock · TTL 10 min</text>
    </g>

    <g id="context-pills" transform="translate(42 226)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700">
      <rect width="112" height="30" rx="15" fill="#082F49" stroke="#0EA5E9"/>
      <text x="18" y="20" fill="#BAE6FD">.Knowledge</text>
      <g transform="translate(130 0)">
        <rect width="92" height="30" rx="15" fill="#0B1828" stroke="#38BDF8"/>
        <text x="18" y="20" fill="#BAE6FD">topics</text>
      </g>
      <g transform="translate(240 0)">
        <rect width="110" height="30" rx="15" fill="#1A1410" stroke="#F59E0B"/>
        <text x="18" y="20" fill="#FEF3C7">f2s skills</text>
      </g>
    </g>
  </g>

  <g id="compression-bar" transform="translate(650 365)">
    <text x="0" y="0" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">4.7 MB project source</text>
    <path d="M206 -5H350" stroke="url(#line)" stroke-width="5" stroke-linecap="round"/>
    <text x="372" y="0" fill="#67E8F9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="700">~300 lines loaded</text>
  </g>
</svg>
